<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div id="login-container" class="container">
        <div class="card">
            <h1>Student Login</h1>
            <p>Please enter your credentials to begin the exam.</p>
            <form id="login-form">
                <input type="text" id="student-id" placeholder="Student ID" required>
                <input type="text" id="student-name" placeholder="Full Name" required>
                <input type="password" id="access-key" placeholder="Access Key" required>
                <button type="submit" class="btn-primary">Start Exam</button>
            </form>
        </div>
    </div>

    <div id="exam-container" class="container hidden">
        <header class="exam-header">
            <div>
                <h2 id="student-display">Student: </h2>
                <p>ATMEP - AMCOL Test of Maritime English Proficiency</p>
            </div>
            <div id="timer-box">Time Left: <span id="timer">120:00</span></div>
        </header>

        <nav class="section-nav">
            <button class="nav-tab active" onclick="goToSection(1)">Listening</button>
            <button class="nav-tab" onclick="goToSection(2)">Speaking</button>
            <button class="nav-tab" onclick="goToSection(3)">Reading</button>
            <button class="nav-tab" onclick="goToSection(4)">Writing</button>
        </nav>

        <div id="question-nav-container">
            <!-- Question nav buttons will be rendered here -->
        </div>

        <main id="questions-area">
            <div id="sec-1" class="exam-section">
                <!-- Questions will be dynamically loaded -->
            </div>

            <div id="sec-2" class="exam-section hidden">
                <!-- Questions will be dynamically loaded -->
            </div>

            <div id="sec-3" class="exam-section hidden">
                <!-- Questions will be dynamically loaded -->
            </div>

            <div id="sec-4" class="exam-section hidden">
                <!-- Questions will be dynamically loaded -->
            </div>
        </main>

        <footer class="exam-footer">
            <button id="prev-btn" class="btn-secondary" onclick="move(-1)">Previous</button>
            <button id="next-btn" class="btn-primary" onclick="move(1)">Next Section</button>
            <button id="submit-btn" class="btn-success hidden">Submit Final Exam</button>
        </footer>
    </div>

    <div id="result-container" class="container hidden">
        <div class="card result-card" id="result-card" style="padding: 40px;">
            <h1 style="color: var(--primary); margin-top: 0;">ATMEP Exam Results</h1>
            <h3 id="result-student-info" style="color: #475569;"></h3>
            <div class="score-grid">
                <div class="score-box">
                    <h4>Listening</h4>
                    <p id="score-sec-1">0%</p>
                </div>
                <div class="score-box">
                    <h4>Speaking</h4>
                    <p id="score-sec-2">0%</p>
                </div>
                <div class="score-box">
                    <h4>Reading</h4>
                    <p id="score-sec-3">0%</p>
                </div>
                <div class="score-box">
                    <h4>Writing</h4>
                    <p id="score-sec-4">0%</p>
                </div>
            </div>
            <div class="overall-score">
                <h3>Overall Percentage</h3>
                <h2 id="score-overall" class="emphasized-score">0%</h2>
                <p id="score-fraction">0/0 Correct</p>
            </div>
        </div>
        <div style="margin-top: 20px; text-align: center; display: flex; gap: 15px; justify-content: center;">
            <button class="btn-success" onclick="downloadResult()">Save to Image</button>
            <button class="btn-secondary" onclick="location.reload()">Back to Login</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
